name: Tests

# Runs on every push and pull request. Nothing here touches the network, so it
# is fast and cannot be flaky because a museum's website was slow.
#
# The important job is `rules`: it proves scrapers/rules.yaml still agrees with
# the examples written inside it, which is what stops a deliberate curation
# decision being quietly undone. See .github/RULES_ARE_OFF_LIMITS.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r scrapers/requirements.txt
          pip install pytest

      - name: Curation rules agree with their own examples
        run: python -m scrapers.check_rules

      - name: Test suite
        run: python -m pytest scrapers/tests -q

      - name: Published data is re-derivable from the raw harvest
        # If this fails, events.json has drifted away from what the rules
        # actually produce — meaning something wrote to it outside the pipeline.
        run: python -m scrapers.reclassify --dry-run
