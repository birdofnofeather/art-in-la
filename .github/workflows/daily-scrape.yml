name: Daily scrape

on:
  schedule:
    # 07:00 UTC ≈ 00:00 Pacific standard / 23:00 Pacific daylight previous day.
    # Adjust if you prefer a different local time.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt

      - name: Install deps
        run: pip install -r scrapers/requirements.txt

      - name: Install headless browser (for bot-gated venues)
        # Norton Simon (Cloudflare) and Huntington (Vercel checkpoint) only
        # yield events to a real browser. If this step ever fails, the run still
        # proceeds — those two scrapers degrade to zero events, not an error.
        continue-on-error: true
        run: |
          pip install -r scrapers/requirements-render.txt
          python -m playwright install --with-deps chromium

      - name: Run scrapers
        id: scrape
        # Exit code 1 means the fleet safety gate REFUSED to publish — the run
        # worked, and it deliberately kept the previous data on the site rather
        # than replacing it with something that looked broken. That is a
        # success of the safety design, not a crash, so it must not be treated
        # as a job failure (which would raise the wrong alert). Anything else
        # non-zero is a real failure.
        run: |
          set +e
          python -m scrapers.run_all
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
        timeout-minutes: 25
        env:
          # Optional: enables the LLM fallback for events whose dates the
          # scrapers can't parse. Set in Settings → Secrets → Actions.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post scraper warnings summary
        if: always()
        continue-on-error: true
        run: |
          python - << 'EOF'
          import json, os, pathlib
          f = pathlib.Path("public/data/warnings.json")
          if not f.exists():
              print("No warnings file yet.")
              exit()
          data = json.loads(f.read_text())
          warnings = data.get("warnings", []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if not summary:
              exit()
          with open(summary, "a") as out:
              if not warnings:
                  out.write("## ✅ Scraper warnings: none\n\n")
                  out.write("All events had explicit dates and times.\n")
              else:
                  out.write(f"## ⚠️ Scraper warnings: {len(warnings)} event(s) skipped\n\n")
                  out.write("These events were found on the venue site but could not be registered because the scraper didn't find an explicit time. Fix the scraper when the site format has changed.\n\n")
                  out.write("| Venue | Title | Reason |\n")
                  out.write("|-------|-------|--------|\n")
                  for w in warnings:
                      venue = w.get("venue_id","")
                      title = w.get("title","").replace("|","\\|")
                      reason = w.get("reason","").replace("|","\\|")
                      out.write(f"| `{venue}` | {title} | {reason} |\n")
          EOF

      - name: Post status report
        if: always()
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, os, pathlib
          f = pathlib.Path("public/data/status.json")
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if not f.exists() or not summary:
              raise SystemExit
          s = json.loads(f.read_text())
          icon = {"green": "\u2705", "yellow": "\u26a0\ufe0f", "red": "\U0001f6a8"}
          t, c = s["totals"], s["counts"]
          with open(summary, "a") as out:
              out.write(f"## {icon.get(s['verdict'],'')} Status: {s['verdict'].upper()}\n\n")
              if not s.get("published", True):
                  out.write("### PUBLISH REFUSED — the site is serving the previous data\n\n")
                  for r in (s.get("fleet_checks") or {}).get("blocking", []):
                      out.write(f"- {r}\n")
                  out.write("\n")
              out.write(f"**{t['events']} events** and **{t['exhibitions']} exhibitions** "
                        f"from {t['venues_producing']} of {t['venues_checked']} venues. ")
              out.write(f"{c['red']} red, {c['yellow']} yellow, {c['green']} green.\n\n")
              if s.get("unreachable"):
                  out.write(f"_Could not reach {len(s['unreachable'])} venue site(s): "
                            f"{', '.join(s['unreachable'])} — their problem, not ours._\n\n")
              rows = [v for v in s["venues"] if v["verdict"] != "green"]
              if not rows:
                  out.write("Every venue checked is healthy.\n")
              else:
                  out.write("| Venue | Verdict | Events | Shows | What is wrong |\n")
                  out.write("|---|---|--:|--:|---|\n")
                  for v in rows:
                      why = "; ".join(v["reasons"]).replace("|", "\\|")
                      out.write(f"| `{v['venue_id']}` | {icon.get(v['verdict'],'')} "
                                f"{v['verdict']} | {v['events']} | {v['exhibitions']} | {why} |\n")
          EOF

      - name: Commit updated data
        if: always()
        run: |
          git config user.name  "art-in-la-bot"
          git config user.email "art-in-la-bot@users.noreply.github.com"
          git config merge.ours.driver true   # honor .gitattributes merge=ours for generated data
          git add public/data/events.json public/data/archive.json public/data/raw_events.json \
                  public/data/warnings.json public/data/scraped_venues.json \
                  public/data/health.json public/data/status.json public/data/feeds
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): daily scrape $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: Alert when venues need attention
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF' > /tmp/alert_body.md
          import json, pathlib
          f = pathlib.Path("public/data/status.json")
          if not f.exists():
              raise SystemExit
          s = json.loads(f.read_text())
          red = [v for v in s["venues"] if v["verdict"] == "red"]
          refused = not s.get("published", True)
          if not red and not refused:
              raise SystemExit
          print("@birdofnofeather — the daily scrape needs attention.\n")
          if refused:
              print("**The run refused to publish**, so the site is still showing "
                    "the previous data:\n")
              for r in (s.get("fleet_checks") or {}).get("blocking", []):
                  print(f"- {r}")
              print()
          if red:
              print(f"**{len(red)} venue(s) are broken.** These are ours to fix — "
                    f"venues whose own website is unreachable are listed as yellow "
                    f"instead, because that is their problem.\n")
              print("| Venue | Events | Shows | What is wrong |")
              print("|---|--:|--:|---|")
              for v in red:
                  why = "; ".join(v["reasons"]).replace("|", "\\|")
                  print(f"| `{v['venue_id']}` | {v['events']} | {v['exhibitions']} | {why} |")
          print("\nFull report: `public/data/status.json`")
          EOF
          if [ -s /tmp/alert_body.md ]; then
            existing=$(gh issue list --state open --search "Scraper health alert in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file /tmp/alert_body.md
            else
              gh issue create --title "Scraper health alert" --body-file /tmp/alert_body.md
            fi
          else
            existing=$(gh issue list --state open --search "Scraper health alert in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Everything is green again — closing."
              gh issue close "$existing"
            fi
          fi

      - name: Alert on job failure (creates an issue → emails you)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Daily scrape FAILED $(date -u +'%Y-%m-%d')"             --body "@birdofnofeather — the daily scrape workflow failed. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Trigger deploy
        if: success()
        # Pushes made with GITHUB_TOKEN don't fire `push` workflows, so tell
        # deploy.yml directly via the repository_dispatch event it listens for.
        run: |
          curl -sS --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"data-updated"}'