# Venues scraped WITHOUT a bespoke parser (see scrapers/venues/_generic.py).
#
# URLs come from public/data/venues.json (events_url, exhibitions_url) — the
# single source of truth. This file only says HOW to read each venue:
#
#   heuristic: true        run the generic title+date card reader. Only set
#                          after its output for that venue was checked by hand
#                          (it is reliable on some sites, wrong on others).
#   url_must_contain: ...  keep only items whose link contains this text
#                          (multi-city organisations).
#   default_event_type:    type when the title gives no clue (e.g. performance
#                          at a theater, exhibition for a gallery page).
#
# Every venue here also gets the LLM reader (needs ANTHROPIC_API_KEY) as the
# last resort, so a venue with no flags simply waits for that tier.
# A venue with a bespoke module in scrapers/venues/ must NOT be listed here.

venues:
  # ── Art venues: checked, generic reader on ─────────────────────────────
  chinese_american_museum: {heuristic: true}
  lacp: {heuristic: true}
  side_street: {heuristic: true, default_event_type: workshop}
  fulcrum: {heuristic: true}
  monte_vista: {heuristic: true, default_event_type: exhibition}
  tsa_la: {heuristic: true, url_must_contain: "tigerstrikesasteroid.com/la/", default_event_type: exhibition}

  # ── Art venues: no reliable pattern — LLM reader only ──────────────────
